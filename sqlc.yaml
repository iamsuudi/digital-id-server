version: "2"
sql:
  - schema: "database/schemas"
    queries: 
      - "database/queries"
    engine: "postgresql"
    gen:
      go:
        package: "repository"
        out: "internal/repository"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_db_tags: true
        emit_prepared_queries: true
        emit_exact_table_names: true
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
            nullable: true
          - db_type: "text"
            go_type: "string"
          - db_type: "text"
            go_type:
              type: "string"
              pointer: true
            nullable: true
          - db_type: "varchar"
            go_type: "string"
          - db_type: "varchar"
            go_type:
              type: "string"
              pointer: true
            nullable: true
          - db_type: "document_type"
            go_type: "string"
          - db_type: "document_type"
            go_type:
              type: "string"
              pointer: true
            nullable: true
          - db_type: "document_status"
            go_type: "string"
          - db_type: "document_status"
            go_type:
              type: "string"
              pointer: true
            nullable: true
          - db_type: "payment_method"
            go_type: "string"
          - db_type: "payment_method"
            go_type:
              type: "string"
              pointer: true
            nullable: true
          - db_type: "payment_status"
            go_type: "string"
          - db_type: "payment_status"
            go_type:
              type: "string"
              pointer: true
            nullable: true
          - db_type: "gender"
            go_type: "string"
          - db_type: "gender"
            go_type:
              type: "string"
              pointer: true
            nullable: true
          - db_type: "marital_status"
            go_type: "string"
          - db_type: "marital_status"
            go_type:
              type: "string"
              pointer: true
            nullable: true
          - db_type: "religion"
            go_type: "string"
          - db_type: "religion"
            go_type:
              type: "string"
              pointer: true
            nullable: true
          - db_type: "pg_catalog.numeric"
            go_type: "float64"
          - db_type: "pg_catalog.numeric"
            go_type:
              type: "float64"
              pointer: true
            nullable: true
          - db_type: "pg_catalog.int4"
            go_type: "int32"
          - db_type: "pg_catalog.int4"
            go_type:
              type: "int32"
              pointer: true
            nullable: true
          - db_type: "pg_catalog.int8"
            go_type: "int64"
          - db_type: "pg_catalog.int8"
            go_type:
              type: "int64"
              pointer: true
            nullable: true
          - db_type: "pg_catalog.timestamp"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "pg_catalog.timestamp"
            go_type:
              import: "time"
              type: "Time"
              pointer: true
            nullable: true
          - db_type: "tsvector"
            go_type: "string"
          - db_type: "tsvector"
            go_type:
              type: "string"
              pointer: true
            nullable: true
version: "2"
sql:
    - engine: "postgresql"
      queries:
          - "database/queries"
          - "database/queries/resident"
          - "database/queries/auth"
      schema: "database/schema.sql"
      gen:
          go:
              package: "sqlc"
              out: "database/sqlc"
              sql_package: "pgx/v5"
